<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Hugo — Application and web developer">
  <style>
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .fade { opacity: 0; animation: in 900ms ease-out forwards; }
    .d1 { animation-delay: 120ms; } .d2 { animation-delay: 300ms; } .d3 { animation-delay: 480ms; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .fade { animation: none; opacity: 1; } }
  </style>
  <rect width="1200" height="320" rx="12" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="12" fill="none" stroke="#d0d7de"/>

  <g class="fade">
    <text x="72" y="96" class="mono" font-size="15" letter-spacing="2" fill="#57606a">HUGOOPR04</text>
  </g>
  <g class="fade d1">
    <text x="68" y="182" class="sans" font-size="76" font-weight="600" letter-spacing="-2.5" fill="#0d1117">Hugo<tspan fill="#0969da">.</tspan></text>
  </g>
  <g class="fade d2">
    <text x="72" y="226" class="sans" font-size="24" fill="#57606a">Building applications and websites that feel effortless.</text>
  </g>
  <g class="fade d3">
    <line x1="72" y1="260" x2="1128" y2="260" stroke="#d0d7de"/>
    <text x="72" y="290" class="mono" font-size="14" fill="#57606a">Salamanca, ES</text>
    <text x="1128" y="290" text-anchor="end" class="mono" font-size="14" fill="#57606a">xync.es</text>
  </g>
</svg>
